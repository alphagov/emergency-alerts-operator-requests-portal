    <div class="govuk-width-container">
      <main class="govuk-main-wrapper" id="main-content">
        <h1 class="govuk-heading-xl">Upload Logs</h1>

        <p class="govuk-body">
          Use the link from your invite email to upload your CBC log archive. If you
          have arrived at this page without a valid link, request a new invite.
        </p>

        <form id="uploadForm">
          <div class="govuk-form-group">
            <label class="govuk-label" for="logFile">Select ZIP file</label>
            <input
              type="file"
              id="logFile"
              class="govuk-file-upload"
              accept=".zip"
            >
          </div>
          <button type="submit" class="govuk-button">Upload Logs</button>
        </form>

        <script>
          const UPLOAD_ORIGIN = window.location.origin;

          document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            if (!token) {
              return window.location.href = 'invalid-request.html';
            }

            document.getElementById('uploadForm').addEventListener('submit', async e => {
              e.preventDefault();

              const fileEl = document.getElementById('logFile');

              if (!fileEl.files.length) {
                return window.location.href = 'invalid-request.html';
              }

              const uploadUrl = `${UPLOAD_ORIGIN}/log-upload?token=${encodeURIComponent(token)}`;

              try {
                const resp = await fetch(uploadUrl, {
                  method: 'PUT',
                  body: fileEl.files[0],
                  headers: { 'Content-Type': 'application/zip' }
                });

                if (resp.ok) {
                  return window.location.href = 'upload-success.html';
                }

                const errType = resp.headers.get('X-Error-Type');
                switch (resp.status) {
                  case 400:
                    window.location.href = 'invalid-request.html';
                    break;
                  case 403:
                    if (errType === 'expired_link') {
                      window.location.href = 'link-expired.html';
                    } else if (errType === 'already_used') {
                      window.location.href = 'max-limit.html';
                    } else {
                      window.location.href = 'error.html';
                    }
                    break;
                  case 405:
                    window.location.href = 'method-not-allowed.html';
                    break;
                  default:
                    window.location.href = 'error.html';
                }
              } catch (err) {
                console.error('Upload error:', err);
                window.location.href = 'error.html';
              }
            });
          });
        </script>
      </main>
    </div>
