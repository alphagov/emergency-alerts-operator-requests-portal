    <div class="govuk-width-container">
      <main class="govuk-main-wrapper" id="main-content">
        <h1 class="govuk-heading-xl">Upload Logs</h1>

        <form id="uploadForm">
          <div class="govuk-form-group">
            <label class="govuk-label" for="mnoInput">MNO identifier</label>
            <input
              type="text"
              id="mnoInput"
              class="govuk-input govuk-input--width-10"
              autocomplete="off"
            >
          </div>
          <div class="govuk-form-group">
            <label class="govuk-label" for="broadcastIdInput">Broadcast ID</label>
            <input
              type="text"
              id="broadcastIdInput"
              class="govuk-input"
              autocomplete="off"
            >
          </div>
          <div class="govuk-form-group">
            <label class="govuk-label" for="logFile">Select ZIP file</label>
            <input
              type="file"
              id="logFile"
              class="govuk-file-upload"
              accept=".zip"
            >
          </div>
          <button type="submit" class="govuk-button">Upload Logs</button>
        </form>

        <script>
          const UPLOAD_ORIGIN = 'https://operator-requests.dev.emergency-alerts.service.gov.uk';

          document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const mnoParam = urlParams.get('mno');
            const broadcastIdParam = urlParams.get('broadcast_id');

            if (mnoParam) document.getElementById('mnoInput').value = mnoParam;
            if (broadcastIdParam) document.getElementById('broadcastIdInput').value = broadcastIdParam;

            document.getElementById('uploadForm').addEventListener('submit', async e => {
              e.preventDefault();

              const mnoId = document.getElementById('mnoInput').value.trim();
              const broadcastId = document.getElementById('broadcastIdInput').value.trim();
              const fileEl = document.getElementById('logFile');

              if (!mnoId || !broadcastId || !fileEl.files.length) {
                return window.location.href = 'invalid-request.html';
              }

              const uploadUrl = `${UPLOAD_ORIGIN}/log-upload?mno=${encodeURIComponent(mnoId)}&broadcast_id=${encodeURIComponent(broadcastId)}`;

              try {
                const resp = await fetch(uploadUrl, {
                  method: 'PUT',
                  body: fileEl.files[0],
                  headers: { 'Content-Type': 'application/zip' }
                });

                if (resp.ok) {
                  return window.location.href = 'upload-success.html';
                }

                const errType = resp.headers.get('X-Error-Type');
                switch (resp.status) {
                  case 400:
                    window.location.href = 'invalid-request.html';
                    break;
                  case 403:
                    if (errType === 'expired_link') {
                      window.location.href = 'link-expired.html';
                    } else if (errType === 'already_used') {
                      window.location.href = 'max-limit.html';
                    } else {
                      window.location.href = 'error.html';
                    }
                    break;
                  case 405:
                    window.location.href = 'method-not-allowed.html';
                    break;
                  default:
                    window.location.href = 'error.html';
                }
              } catch (err) {
                console.error('Upload error:', err);
                window.location.href = 'error.html';
              }
            });
          });
        </script>
      </main>
    </div>
