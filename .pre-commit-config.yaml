repos:
  - repo: local
    hooks:
      - id: terraform-fmt
        name: terraform fmt
        entry: terraform fmt -check -recursive terraform
        language: system
        files: \.(tf|tfvars)$
        pass_filenames: false
      - id: isort
        name: isort
        entry: isort --check-only
        language: system
        types: [python]
      - id: black
        name: black
        entry: black --check
        language: system
        types: [python]
      - id: flake8
        name: flake8
        entry: flake8
        language: system
        types: [python]
